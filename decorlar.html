<!doctype html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Decorist Lady — toy, nişan, xına, ad günü və xüsusi tədbirlər üçün dekor xidmətləri."><link rel="stylesheet" href="assets/style.css"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♡</text></svg>"><title>Dekorlar | Decorist Lady</title></head><body><div id="site-nav"></div><main><header class="pagehead container"><span class="eyebrow">Portfolio</span><h1>Dekorlarımız</h1><p>Hər tədbir öz hekayəsini danışır. Filtrləyin və sizə yaxın olan atmosferi kəşf edin.</p></header><section class="container" style="padding-bottom:90px"><div class="filters" id="filters"><button class="filter active" data-f="Hamısı">Hamısı</button><button class="filter" data-f="Toy">Toy</button><button class="filter" data-f="Nişan">Nişan</button><button class="filter" data-f="Xına">Xına</button><button class="filter" data-f="Ad günü">Ad günü</button><button class="filter" data-f="Korporativ">Korporativ</button></div><div class="gallery" id="grid"></div></section></main><div id="site-footer"></div><div class="toast" id="toast"></div><script src="assets/app.js"></script><script>DL.boot();let all=[];const grid=document.querySelector('#grid');function draw(f='Hamısı'){let a=f==='Hamısı'?all:all.filter(x=>x.category===f);grid.innerHTML=a.map((x,i)=>`<article class="photo ${i%7===0?'wide':''}"><img loading="lazy" src="${x.image_url}" alt="${x.title}"><div class="photo-info"><h3>${x.title}</h3><small>${x.category} • ${x.description||''}</small></div></article>`).join('')||'<p>Tezliklə yeni işlər əlavə olunacaq.</p>'}DL.api('/api/decor').then(x=>{all=x;draw()}).catch(()=>{all=[{title:'Romantik mərasim',category:'Toy',image_url:'https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=85'},{title:'Zərif masa dekoru',category:'Toy',image_url:'https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1200&q=85'},{title:'Nişan atmosferi',category:'Nişan',image_url:'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=85'},{title:'Xüsusi gecə',category:'Xına',image_url:'https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=1200&q=85'}];draw()});document.querySelector('#filters').onclick=e=>{if(!e.target.dataset.f)return;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');draw(e.target.dataset.f)}</script></body></html>
